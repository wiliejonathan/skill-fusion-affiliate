name: Smoke Test Apps Script
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apps-script-smoke.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test health
        run: |
          set -e
          URL="https://script.google.com/macros/s/AKfycbwEaWGv8ykfHPDqI4eUAp0U9FqYWeMb3RsS57K9QDsxnvbOI9h0HArIVASgn2llUZqaNQ/exec?action=health"
          BODY="$(curl -fsSL "$URL")"
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
      - name: Test catalog
        run: |
          set -e
          URL="https://script.google.com/macros/s/AKfycbwEaWGv8ykfHPDqI4eUAp0U9FqYWeMb3RsS57K9QDsxnvbOI9h0HArIVASgn2llUZqaNQ/exec?action=catalog"
          BODY="$(curl -fsSL "$URL")"
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
          echo "$BODY" | grep -q '"products"'
