name: Build Android Admin APK

on:
  push:
    branches:
      - feat/android-admin-mechanical-apk
    paths:
      - "android-admin/**"
      - ".github/workflows/build-android-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan di $ANDROID_HOME" >&2
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -n 200
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable APK
        run: gradle -p android-admin :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android-admin/app/build/outputs/apk/debug/app-debug.apk dist/SkillFusion-Admin-Mechanical-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkillFusion-Admin-Mechanical-v1.0.0
          path: dist/SkillFusion-Admin-Mechanical-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
