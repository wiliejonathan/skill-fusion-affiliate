name: Deploy Skill Fusion Admin

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"

permissions:
  contents: read

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      VERCEL_ORG_ID: team_lInjC9xKC4PF5vHU2YRdwgFO
      VERCEL_PROJECT_ID: prj_cgPtdUabHtu3VWXOJo39m0EAUreN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Vercel token
        shell: bash
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Pull Vercel production settings
        run: npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build production bundle
        run: npx --yes vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
