name: Smoke Test GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-smoke.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check site
        run: |
          set -e
          URL="https://wiliejonathan.github.io/skill-fusion-affiliate/"
          code="$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$URL")"
          echo "HTTP $code"
          head -c 500 /tmp/page.html || true
          test "$code" = "200"
          grep -q "Skill Fusion" /tmp/page.html
